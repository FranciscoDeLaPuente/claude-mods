# Comprueba en cada PR las reglas de ramas y commits (ver CLAUDE.md) con el mismo script que los
# hooks de .githooks/. A diferencia de los hooks, no depende de que cada clon los active.
name: Git rules

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  git-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Branch, PR title and commit messages
        env:
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          sh .githooks/rules.sh branch "$BRANCH" || status=1
          # Al fusionar con squash, el título del PR es la primera línea del commit que llega a main
          sh .githooks/rules.sh title "$TITLE" || { echo "  (PR title)" >&2; status=1; }
          for sha in $(git rev-list --reverse "$BASE_SHA..$HEAD_SHA"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/message"
            sh .githooks/rules.sh message --raw "$RUNNER_TEMP/message" || { echo "  (commit $sha)" >&2; status=1; }
          done
          exit $status
