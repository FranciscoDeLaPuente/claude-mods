# Comprueba en cada PR las reglas de ramas y commits (ver CLAUDE.md) con el mismo script que los
# hooks de .githooks/. A diferencia de los hooks, no depende de que cada clon los active.
name: Git rules

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  git-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Branch, PR title and description, and commit messages
        env:
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # La firma de Claude se rechaza solo en los PR del propietario; los demás firman como quieran
          REJECT_CLAUDE_SIGNATURE: ${{ github.event.pull_request.user.login == github.repository_owner }}
        run: |
          status=0
          sh .githooks/rules.sh branch "$BRANCH" || status=1
          # Al fusionar con squash, la primera línea del commit en main es el título más " (#N)": se comprueba así
          sh .githooks/rules.sh title "$TITLE (#$PR_NUMBER)" ||
            { echo "  (PR title, with the \" (#$PR_NUMBER)\" GitHub adds on squash)" >&2; status=1; }
          printf '%s\n' "$BODY" > "$RUNNER_TEMP/body"
          sh .githooks/rules.sh body "$RUNNER_TEMP/body" || { echo "  (PR description)" >&2; status=1; }
          for sha in $(git rev-list --reverse "$BASE_SHA..$HEAD_SHA"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/message"
            sh .githooks/rules.sh message --raw "$RUNNER_TEMP/message" || { echo "  (commit $sha)" >&2; status=1; }
          done
          exit $status
